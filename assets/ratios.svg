<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d"><title id="t">Financial analysis framework</title><desc id="d">Six financial ratios are examined through profitability, liquidity, efficiency, and solvency. This diagram shows analytical categories, not measured results.</desc><g font-family="sans-serif" text-anchor="middle"><text x="200" y="45" fill="#173e4b" font-size="26" font-weight="bold">6 financial ratios</text><g fill="#173e4b"><rect x="20" y="76" width="170" height="56" rx="4"/><rect x="210" y="76" width="170" height="56" rx="4"/></g><g fill="#d0e7e2"><rect x="20" y="149" width="170" height="56" rx="4"/><rect x="210" y="149" width="170" height="56" rx="4"/></g><g font-size="17"><text x="105" y="111" fill="white">Profitability</text><text x="295" y="111" fill="white">Liquidity</text><text x="105" y="184" fill="#174c4a">Efficiency</text><text x="295" y="184" fill="#174c4a">Solvency</text></g></g></svg>

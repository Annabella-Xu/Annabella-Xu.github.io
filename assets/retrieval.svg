<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="t d"><title id="t">SEC filing retrieval workflow</title><desc id="d">SEC 10-K filings are processed into Item 1A and Item 7 sections, then organized with metadata for filtered retrieval.</desc><g font-family="sans-serif" text-anchor="middle"><rect x="15" y="25" width="115" height="78" rx="4" fill="#173e4b"/><text x="72" y="57" fill="white" font-size="17">SEC 10-K</text><text x="72" y="81" fill="#bbd9dc" font-size="14">Source filings</text><path d="M130 64H168V145" fill="none" stroke="#60828b" stroke-width="2"/><rect x="150" y="120" width="122" height="85" rx="4" fill="#d0e7e2"/><text x="211" y="151" fill="#174c4a" font-size="16">Item 1A / Item 7</text><text x="211" y="178" fill="#174c4a" font-size="14">Section extraction</text><path d="M250 120V64H280" fill="none" stroke="#60828b" stroke-width="2"/><rect x="280" y="25" width="105" height="78" rx="4" fill="#173e4b"/><text x="332" y="55" fill="white" font-size="16">Retrieval</text><text x="332" y="80" fill="#bbd9dc" font-size="13">Metadata filters</text></g></svg>
